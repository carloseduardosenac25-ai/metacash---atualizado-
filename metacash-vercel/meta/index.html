<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetaCash</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/paginas/global.css" />
  <link rel="stylesheet" href="../css/paginas/login.css" />
</head>
<body>
  <div class="background"></div>

  <main class="login-card">
    <div class="logo">
      <img src="../assets/icons/imagens/logo/abacate.png" alt="Logo MetaCash" />
      <p>Controle Financeiro Inteligente</p>
    </div>

    <div class="text">
      <h1>Bem-vindo!</h1>
      <p>Organize seu dinheiro de forma simples, prática e segura.</p>
    </div>

    <form id="loginForm">
      <label>Seu nome</label>
      <input type="text" id="nome" placeholder="Digite seu nome" required />
      <button type="submit">Começar Agora →</button>
    </form>

    <div class="info">Projeto Escolar • Versão Beta</div>
  </main>

  <script src="../js/login.js"></script>
</body>
</html>
