<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Configuração | MetaCash</title>


  <!-- =====================================
          FONTE
  ====================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================
          CSS
  ====================================== -->

  <link
    rel="stylesheet"
    href="../css/paginas/global.css"
  >

  <link
    rel="stylesheet"
    href="../css/paginas/cadastro.css"
  >

</head>


<body>


  <!-- =====================================
          FUNDO
  ====================================== -->

  <div class="background"></div>



  <!-- =====================================
          CARD
  ====================================== -->

  <main class="config-card">


    <!-- =================================
            LOGO
    ================================== -->

    <div class="logo">

      <img
        src="../assets/icons/imagens/logo/abacate.png"
        alt="Logo MetaCash"
      >

    </div>



    <!-- =================================
            BOAS-VINDAS
    ================================== -->

    <section class="welcome">

      <h1 id="nomeUsuario">

        Olá!

      </h1>


      <p>

        Vamos configurar sua conta.

      </p>

    </section>



    <!-- =================================
            FORMULÁRIO
    ================================== -->

    <form id="configForm">


      <!-- =================================
              SALDO INICIAL
      ================================== -->

      <div class="form-group">


        <label for="saldo">

          Quanto você possui atualmente?

        </label>


        <div class="input-money">


          <span>

            R$

          </span>


          <input
            type="number"
            id="saldo"
            placeholder="0,00"
            min="0"
            step="0.01"
            required
          >


        </div>


      </div>



      <!-- =================================
              CATEGORIAS
      ================================== -->

      <div class="form-group">


        <h2>

          Escolha suas categorias

        </h2>


        <p class="description">

          Selecione as categorias que você mais utiliza.

        </p>


        <div class="categories">


          <!-- JOGOS -->

          <label class="category">

            <input
              type="checkbox"
              value="Jogos"
            >

            <span>

              🎮

            </span>

            <strong>

              Jogos

            </strong>

          </label>



          <!-- ALIMENTAÇÃO -->

          <label class="category">

            <input
              type="checkbox"
              value="Alimentação"
            >

            <span>

              🍔

            </span>

            <strong>

              Alimentação

            </strong>

          </label>



          <!-- TRANSPORTE -->

          <label class="category">

            <input
              type="checkbox"
              value="Transporte"
            >

            <span>

              🚌

            </span>

            <strong>

              Transporte

            </strong>

          </label>



          <!-- STREAMING -->

          <label class="category">

            <input
              type="checkbox"
              value="Streaming"
            >

            <span>

              🎬

            </span>

            <strong>

              Streaming

            </strong>

          </label>



          <!-- COMPRAS -->

          <label class="category">

            <input
              type="checkbox"
              value="Compras"
            >

            <span>

              🛍️

            </span>

            <strong>

              Compras

            </strong>

          </label>



          <!-- ESTUDOS -->

          <label class="category">

            <input
              type="checkbox"
              value="Estudos"
            >

            <span>

              📚

            </span>

            <strong>

              Estudos

            </strong>

          </label>



          <!-- LAZER -->

          <label class="category">

            <input
              type="checkbox"
              value="Lazer"
            >

            <span>

              🎮

            </span>

            <strong>

              Lazer

            </strong>

          </label>



          <!-- OUTROS -->

          <label class="category">

            <input
              type="checkbox"
              value="Outros"
            >

            <span>

              📦

            </span>

            <strong>

              Outros

            </strong>

          </label>


        </div>

      </div>



      <!-- =================================
              CONTINUAR
      ================================== -->

      <button
        type="submit"
        class="continue-button"
      >

        Começar

        <span>

          →

        </span>

      </button>


    </form>



    <!-- =================================
            RODAPÉ
    ================================== -->

    <p class="footer-text">

      Essas informações poderão ser alteradas depois.

    </p>


  </main>



  <!-- =====================================
          JAVASCRIPT
  ====================================== -->

  <script src="../js/cadastro.js"></script>

</body>

</html>
