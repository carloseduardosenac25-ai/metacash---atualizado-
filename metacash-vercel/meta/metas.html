<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Metas | MetaCash</title>


    <!-- =====================================
            FONTE
    ====================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
            CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="../css/paginas/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/paginas/metas.css"
    >

</head>


<body>


    <!-- =====================================
            SIDEBAR
    ====================================== -->

    <aside class="sidebar">


        <div class="sidebar-logo">

            <img
                src="../assets/icons/imagens/logo/abacate.png"
                alt="MetaCash"
            >

        </div>


        <nav class="menu">


            <a
                href="dashboard.html"
                class="menu-item"
            >
                <span>⌂</span>
                Dashboard
            </a>


            <a
                href="entradas.html"
                class="menu-item"
            >
                <span>＋</span>
                Entradas
            </a>


            <a
                href="gastos.html"
                class="menu-item"
            >
                <span>−</span>
                Gastos
            </a>


            <a
                href="metas.html"
                class="menu-item active"
            >
                <span>🎯</span>
                Metas
            </a>


            <a
                href="relatorios.html"
                class="menu-item"
            >
                <span>▣</span>
                Relatórios
            </a>


            <a
                href="configuracoes.html"
                class="menu-item"
            >
                <span>⚙</span>
                Configurações
            </a>


        </nav>


        <div class="sidebar-bottom">

            <button id="sair">

                ↪ Sair

            </button>

        </div>


    </aside>



    <!-- =====================================
            CONTEÚDO
    ====================================== -->

    <main class="metas-main">


        <!-- =================================
                CABEÇALHO
        ================================== -->

        <header class="metas-header">


            <div>

                <p class="small-title">
                    Planejamento
                </p>


                <h1>
                    Minhas Metas
                </h1>


                <p class="header-description">
                    Crie objetivos financeiros e acompanhe seu progresso.
                </p>

            </div>


            <div
                class="avatar"
                id="avatar"
            >
                U
            </div>


        </header>



        <!-- =================================
                CRIAR META
        ================================== -->

        <section class="nova-meta-card">


            <div class="meta-card-title">

                <div class="meta-icon">
                    🎯
                </div>


                <div>

                    <h2>
                        Criar nova meta
                    </h2>

                    <p>
                        Defina um objetivo para começar a acompanhar.
                    </p>

                </div>

            </div>


            <form id="metaForm">


                <!-- NOME -->

                <div class="form-group">

                    <label for="nomeMeta">
                        Nome da meta
                    </label>


                    <input
                        type="text"
                        id="nomeMeta"
                        placeholder="Ex.: Comprar um jogo"
                        maxlength="60"
                        required
                    >

                </div>



                <!-- VALOR DA META -->

                <div class="form-group">

                    <label for="valorMeta">
                        Valor da meta
                    </label>


                    <div class="input-money">

                        <span>
                            R$
                        </span>


                        <input
                            type="number"
                            id="valorMeta"
                            placeholder="0,00"
                            min="0.01"
                            step="0.01"
                            required
                        >

                    </div>

                </div>



                <!-- VALOR JÁ GUARDADO -->

                <div class="form-group">

                    <label for="valorGuardado">
                        Valor já guardado
                    </label>


                    <div class="input-money">

                        <span>
                            R$
                        </span>


                        <input
                            type="number"
                            id="valorGuardado"
                            placeholder="0,00"
                            min="0"
                            step="0.01"
                            value="0"
                        >

                    </div>

                </div>



                <!-- PRAZO -->

                <div class="form-group">

                    <label for="prazoMeta">
                        Prazo
                    </label>


                    <input
                        type="date"
                        id="prazoMeta"
                        required
                    >

                </div>



                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn-criar-meta"
                >

                    <span>＋</span>

                    Criar meta

                </button>


            </form>


        </section>



        <!-- =================================
                LISTA DE METAS
        ================================== -->

        <section class="metas-section">


            <div class="section-header">

                <div>

                    <h2>
                        Suas metas
                    </h2>

                    <p>
                        Acompanhe seu progresso financeiro.
                    </p>

                </div>

            </div>


            <div
                id="listaMetas"
                class="lista-metas"
            ></div>


        </section>


    </main>



    <!-- =====================================
            JAVASCRIPT
    ====================================== -->

    <script src="../js/storage.js"></script>

    <script src="../js/metas.js"></script>


</body>

</html>
