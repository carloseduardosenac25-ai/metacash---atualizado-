<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Entrada | MetaCash</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/paginas/global.css">
  <link rel="stylesheet" href="../css/entradas.css">
</head>

<body>
  <div class="background"></div>

  <main class="income-card">
    <a href="dashboard.html" class="back-button">← Voltar para o dashboard</a>

    <div class="page-header">
      <div class="icon">+</div>
      <div>
        <h1>Adicionar entrada</h1>
        <p>Registre uma entrada para manter seu controle financeiro.</p>
      </div>
    </div>

    <form id="entradaForm">
      <div class="form-group">
        <label for="valor">Valor da entrada</label>
        <div class="input-money">
          <span>R$</span>
          <input type="number" id="valor" placeholder="0,00" min="0.01" step="0.01" required>
        </div>
      </div>

      <div class="form-group">
        <label for="tipo">Tipo de entrada</label>
        <select id="tipo" required>
          <option value="">Selecione o tipo</option>
          <option value="Salário">💼 Salário</option>
          <option value="Mesada">💰 Mesada</option>
          <option value="Dinheiro extra">💵 Dinheiro extra</option>
          <option value="Presente">🎁 Presente</option>
          <option value="Venda">🛍️ Venda</option>
          <option value="Outros">📦 Outros</option>
        </select>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição <span>(opcional)</span></label>
        <textarea id="descricao" placeholder="Ex.: Recebi minha mesada..." maxlength="100"></textarea>
      </div>

      <button type="submit" class="save-button"><span>✓</span> Adicionar entrada</button>
    </form>

    <p id="mensagem" class="mensagem"></p>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/paginas/entradas.js"></script>
  
</body>
</html>
