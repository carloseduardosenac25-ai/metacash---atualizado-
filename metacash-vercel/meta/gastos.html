<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Gasto | MetaCash</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/paginas/global.css">
  <link rel="stylesheet" href="../css/gastos.css">
</head>

<body>
  <div class="background"></div>

  <main class="expense-card">
    <a href="dashboard.html" class="back-button">← Voltar para o dashboard</a>

    <div class="page-header">
      <div class="icon">−</div>
      <div>
        <h1>Adicionar gasto</h1>
        <p>Registre um gasto para manter seu controle financeiro.</p>
      </div>
    </div>

    <form id="gastoForm">
      <div class="form-group">
        <label for="valor">Valor do gasto</label>
        <div class="input-money">
          <span>R$</span>
          <input type="number" id="valor" placeholder="0,00" min="0.01" step="0.01" required>
        </div>
      </div>

      <div class="form-group">
        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <option value="">Selecione uma categoria</option>
        </select>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição (opcional)</label>
        <textarea id="descricao" placeholder="Ex.: Comprei um jogo..." maxlength="100"></textarea>
      </div>

      <button type="submit" class="save-button">✓ Adicionar gasto</button>
    </form>

    <p id="mensagem" class="mensagem"></p>
  </main>


   <script src="../js/storage.js"></script>     
  <script src="../js/paginas/gastos.js"></script>
  
</body>
</html>
